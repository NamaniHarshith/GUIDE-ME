name: blind_ai
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  text_to_speech:
    path: packages/text_to_speech
  cupertino_icons: ^1.0.2

  # For Stacked Architecture
  stacked:

  # For Text to Speech
  speech_to_text: ^7.0.0
  # For Speech to Text

  # For the Image
  image_picker: ^1.1.2
  camera: ^0.11.1
  google_ml_kit:

  # For API
  dio: ^5.8.0+1
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # For Logo
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo_pic.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/logo_pic.png
